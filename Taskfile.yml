version: "3"

vars:
  BINARY_NAME: cortex-mcp
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_TIMESTAMP:
    sh: date +%s

tasks:
  default:
    desc: Run all tests
    cmds:
      - task: check

  build:
    desc: Alias for build:debug
    cmds:
      - task: build:debug

  build:debug:
    desc: Build the cortex-mcp binary for debugging (disables optimizations)
    cmds:
      - CGO_ENABLED=0 go build -gcflags="all=-N -l" -ldflags "-X github.com/flipfloptech/cortex-mcp/internal/version.ApplicationVersion={{.BUILD_TIMESTAMP}}" -o {{.BINARY_NAME}} ./cmd/cortex-mcp/...

  build:prod:
    desc: Build a size-optimized, UPX-compressed production binary
    vars:
      UPX:
        sh: which upx 2>/dev/null || find "$HOME/.local/share/mise/installs/upx" -name upx -type f -executable 2>/dev/null | head -1 || echo ""
    preconditions:
      - sh: test -n "{{.UPX}}"
        msg: |
          upx is not installed. Please install it (e.g. mise install upx) to compress production builds.
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/flipfloptech/cortex-mcp/internal/version.ApplicationVersion={{.BUILD_TIMESTAMP}}" -o {{.BINARY_NAME}} ./cmd/cortex-mcp/...
      - "{{.UPX}} --best --lzma {{.BINARY_NAME}}"

  test:
    desc: Run tests with race detection
    deps: [fmt, vet]
    cmds:
      - CGO_ENABLED=0 go test -v -timeout 60s ./...

  test-coverage:
    desc: Run tests with coverage report
    cmds:
      - CGO_ENABLED=0 go test -v -coverprofile=coverage.out -covermode=atomic ./...
      - go tool cover -html=coverage.out -o coverage.html
      - |
        echo ""
        echo "Coverage report: coverage.html"

  benchcov:
    desc: Check benchmark coverage (fails if not 100%)
    cmds:
      - go run ./testutil/benchcov/main

  bench:
    desc: Run all benchmarks
    cmds:
      - CGO_ENABLED=0 go test -bench=. -benchmem -timeout 300s ./...

  benchtrack:
    desc: Run benchmarks and save dated results to .benchmarks/
    cmds:
      - CGO_ENABLED=0 go test -bench=. -benchmem -timeout 300s ./... 2>&1 | go run ./testutil/benchtrack/main

  lint:
    desc: Run golangci-lint
    vars:
      GOLANGCI_LINT:
        sh: which golangci-lint 2>/dev/null || find "$HOME/.local/share/mise/installs/golangci-lint" -name golangci-lint -type f 2>/dev/null | head -1 || echo ""
    preconditions:
      - sh: test -n "{{.GOLANGCI_LINT}}"
        msg: |
          golangci-lint is not installed. Install with:
            mise install golangci-lint
          or:
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin
    cmds:
      - "{{.GOLANGCI_LINT}} run ./..."

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  fmt-check:
    desc: Check formatting (fails if any files need formatting)
    cmds:
      - |
        UNFORMATTED=$(gofmt -l .)
        if [ -n "$UNFORMATTED" ]; then
          echo "The following files are not formatted:"
          echo "$UNFORMATTED"
          echo ""
          echo "Run 'task fmt' to fix."
          exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  proto:
    desc: Regenerate protobuf code
    cmds:
      - task: install-proto-tools
      - protoc --go_out=. --go_opt=module=github.com/flipfloptech/cortex-mcp --go-grpc_out=. --go-grpc_opt=module=github.com/flipfloptech/cortex-mcp pkg/mesh/proto/*.proto

  install-proto-tools:
    desc: Install protoc plugins
    internal: true
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
    status:
      - test -f $(go env GOPATH)/bin/protoc-gen-go
      - test -f $(go env GOPATH)/bin/protoc-gen-go-grpc

  check:
    desc: Run all quality gates (fmt, vet, lint, test, benchcov)
    cmds:
      - task: fmt-check
      - task: vet
      - task: lint
      - task: test
      - task: benchcov

  pre-commit:
    desc: Alias for check — run before committing
    cmds:
      - task: check

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f {{.BINARY_NAME}}
      - rm -f coverage.out coverage.html

  run:
    desc: Run the binary locally
    deps: [build]
    cmds:
      - ./{{.BINARY_NAME}} {{.CLI_ARGS}}

  doctor:
    desc: Check development environment
    vars:
      GOLANGCI_LINT:
        sh: which golangci-lint 2>/dev/null || find "$HOME/.local/share/mise/installs/golangci-lint" -name golangci-lint -type f 2>/dev/null | head -1 || echo "golangci-lint"
    cmds:
      - go version
      - "{{.GOLANGCI_LINT}} --version || echo 'golangci-lint not found (install: mise install golangci-lint)'"
      - |
        echo ""
        echo "=== Package Count ==="
        echo "$(go list ./... | wc -l) packages"
      - |
        echo ""
        echo "=== Test Count ==="
        go test -count=0 ./... 2>&1 | grep -c "^ok" || true
